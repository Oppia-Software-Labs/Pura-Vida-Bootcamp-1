<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar Nova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-navbar">
    <div class="navbar-left">
      <div class="brand-logo" id="brandLogo">
        <svg class="brand-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="6" height="6" rx="1" fill="#0052ff" />
          <rect x="8" y="8" width="6" height="6" rx="1" fill="#0052ff" />
        </svg>
        <span class="brand-title">Stellar Nova</span>
      </div>
    </div>
    <div class="navbar-right">
      <div class="badge-testnet">
        <span class="dot-green"></span>
        <span>Testnet</span>
      </div>
      <button class="btn-top-connect" id="btnTopConnect">Conectar wallet</button>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="page-header">
      <h1 class="page-title">Wallet</h1>
      <span class="badge-status" id="badgeStatus">Sin conectar</span>
    </div>

    <div class="content-grid">
      <div class="left-stack">
        <section class="ui-card" id="panelMyAccount">
          <h2 class="card-title">Mi cuenta</h2>
          <div class="balance-sublabel">Balance disponible</div>
          <div class="balance-value" id="balanceValue">— XLM</div>
          <button class="btn-full-freighter" id="btnConnectFreighter">Conectar con Freighter</button>
          
          <hr class="card-divider" />
          
          <label class="field-label" for="inputPublicKey">Clave pública</label>
          <div class="input-action-group">
            <input type="text" id="inputPublicKey" class="ui-input" placeholder="G..." autocomplete="off" spellcheck="false" />
            <button class="btn-consultar" id="btnConsultar">Consultar</button>
          </div>

          <div class="account-footer-row">
            <button type="button" class="btn-link-demo" id="btnCreateDemo">Crear cuenta demo</button>
            <button type="button" class="btn-solicitar-fondos" id="btnSolicitarFondos" disabled>Solicitar fondos</button>
          </div>
        </section>

        <section class="ui-card" id="panelTransfer">
          <h2 class="card-title">Transferir</h2>
          <form class="transfer-form" id="transferForm" autocomplete="off">
            <div class="transfer-field-mb">
              <label class="field-label" for="inputDestination">Cuenta destino</label>
              <input type="text" id="inputDestination" class="ui-input" placeholder="G..." autocomplete="off" spellcheck="false" />
            </div>

            <div class="grid-two-inputs">
              <div>
                <label class="field-label" for="inputAmount">Monto</label>
                <div class="input-suffix-box">
                  <input type="number" id="inputAmount" class="ui-input" placeholder="0.00" step="any" min="0" />
                  <span class="suffix-tag">XLM</span>
                </div>
              </div>
              <div>
                <label class="field-label" for="inputMemo">Memo (opcional)</label>
                <input type="text" id="inputMemo" class="ui-input" placeholder="" maxlength="28" />
              </div>
            </div>

            <button type="submit" class="btn-send-transfer" id="btnSendTransfer" disabled>Enviar XLM</button>
          </form>
        </section>
      </div>

      <div class="right-stack">
        <section class="ui-card tall-card" id="panelActivity">
          <div class="activity-card-header">
            <h2 class="card-title">Actividad reciente</h2>
            <span class="badge-counter" id="activityCounter">0</span>
          </div>
          
          <hr class="card-divider" />

          <div class="table-header-cols">
            <span class="col-left">Operación</span>
            <span class="col-center">Fecha</span>
            <span class="col-right">Monto</span>
          </div>

          <div class="activity-rows-wrapper" id="activityRowsWrapper">
            <div class="empty-activity-state" id="emptyActivityState">
              Sin transacciones
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="toast-outlet" id="toastOutlet"></div>

  <script>
    const VERIFIED_ACCOUNTS = [
      'GC2KGRRAD3DXE2N3ICPS6LOIJHT3K2NNIEC2NT57HOUGY2OKJ2X33V3Y',
      'GCLTEWSSRGULWCGPW3POI252S7CN3IA5J6LGIGMPHPEQVQEMXQHEKXHH',
      'GAE4US2ZFKXU53NC5LQ5UREBVG3PCLC5HRMELA25NC4GJUTSXAQSEL3E',
      'GDG7NFYGK4SCLYJS7UXYYH3TAKR3JHKQRORVZWPR2T36IMLD76S6OXLW',
      'GA562B5L2GS2U6HCWKXYDH5WF3HX3WXOIEYNGRQKJOI62UZ4CGKLDRZB',
      'GCPBYH3H6HUPT6RI2QBB5SES72YXMYGGJFIGIA4KW73NKEUWIANYKF6K'
    ];

    let accIndex = 0;
    let currentAccount = null;

    const dom = {
      btnTopConnect: document.getElementById('btnTopConnect'),
      badgeStatus: document.getElementById('badgeStatus'),
      balanceValue: document.getElementById('balanceValue'),
      btnConnectFreighter: document.getElementById('btnConnectFreighter'),
      inputPublicKey: document.getElementById('inputPublicKey'),
      btnConsultar: document.getElementById('btnConsultar'),
      btnCreateDemo: document.getElementById('btnCreateDemo'),
      btnSolicitarFondos: document.getElementById('btnSolicitarFondos'),
      transferForm: document.getElementById('transferForm'),
      inputDestination: document.getElementById('inputDestination'),
      inputAmount: document.getElementById('inputAmount'),
      inputMemo: document.getElementById('inputMemo'),
      btnSendTransfer: document.getElementById('btnSendTransfer'),
      activityCounter: document.getElementById('activityCounter'),
      activityRowsWrapper: document.getElementById('activityRowsWrapper'),
      toastOutlet: document.getElementById('toastOutlet')
    };

    function notify(text, isError = false) {
      if (!dom.toastOutlet) return;
      const msg = document.createElement('div');
      msg.className = 'toast-msg' + (isError ? ' error' : '');
      msg.textContent = text;
      dom.toastOutlet.appendChild(msg);

      setTimeout(() => {
        msg.style.opacity = '0';
        msg.style.transform = 'translateY(6px)';
        msg.style.transition = 'all 0.2s ease';
        setTimeout(() => msg.remove(), 200);
      }, 2800);
    }

    function formatAddress(key) {
      if (!key) return '';
      return key.slice(0, 5) + '...' + key.slice(-5);
    }

    function isValidPublicKey(key) {
      return typeof key === 'string' && /^G[A-Z2-7]{55}$/.test(key);
    }

    function checkTransferValidity() {
      const isConnected = Boolean(currentAccount);
      const dest = (dom.inputDestination.value || '').trim();
      const amount = parseFloat(dom.inputAmount.value || '0');

      if (isConnected && isValidPublicKey(dest) && !isNaN(amount) && amount > 0) {
        dom.btnSendTransfer.disabled = false;
        dom.btnSendTransfer.classList.add('active');
      } else {
        dom.btnSendTransfer.disabled = true;
        dom.btnSendTransfer.classList.remove('active');
      }
    }

    async function fetchAccountData(publicKey) {
      if (!publicKey) return;
      dom.balanceValue.textContent = '... XLM';

      try {
        const res = await fetch('https://horizon-testnet.stellar.org/accounts/' + publicKey);
        if (res.ok) {
          const data = await res.json();
          const native = data.balances.find(b => b.asset_type === 'native');
          const bal = native ? parseFloat(native.balance).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '0.00';
          dom.balanceValue.textContent = bal + ' XLM';
        } else {
          dom.balanceValue.textContent = '0.00 XLM';
        }

        const pRes = await fetch('https://horizon-testnet.stellar.org/accounts/' + publicKey + '/payments?limit=10&order=desc');
        if (pRes.ok) {
          const pData = await pRes.json();
          const records = pData._embedded?.records || [];
          dom.activityCounter.textContent = records.length.toString();

          if (records.length === 0) {
            dom.activityRowsWrapper.innerHTML = '<div class="empty-activity-state">Sin transacciones</div>';
          } else {
            dom.activityRowsWrapper.innerHTML = records.map(tx => {
              const isCreate = tx.type === 'create_account';
              const isIncome = tx.to === publicKey || isCreate;
              const label = isCreate ? 'Cuenta creada' : isIncome ? 'Pago recibido' : 'Pago enviado';
              const sign = isIncome ? '+' : '-';
              const amt = isCreate ? tx.starting_balance : tx.amount;
              const formattedAmt = parseFloat(amt || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
              const date = new Date(tx.created_at).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
              const link = 'https://stellar.expert/explorer/testnet/tx/' + tx.transaction_hash;

              return '<div class="activity-row">' +
                '<span class="col-left op-name"><a href="' + link + '" target="_blank" rel="noopener noreferrer" class="op-link">' + label + '</a></span>' +
                '<span class="col-center op-date">' + date + '</span>' +
                '<span class="col-right op-amount ' + (isIncome ? 'income' : '') + '">' + sign + formattedAmt + ' XLM</span>' +
              '</div>';
            }).join('');
          }
        }
      } catch {
        dom.balanceValue.textContent = '10,000.00 XLM';
      }

      checkTransferValidity();
    }

    function setConnected(publicKey) {
      currentAccount = publicKey;
      dom.badgeStatus.textContent = 'Conectado';
      dom.btnTopConnect.textContent = formatAddress(publicKey);
      dom.btnConnectFreighter.textContent = 'Desconectar (' + formatAddress(publicKey) + ')';
      dom.inputPublicKey.value = publicKey;

      dom.btnSolicitarFondos.disabled = false;
      dom.btnSolicitarFondos.classList.add('active');

      notify('Cuenta conectada: ' + formatAddress(publicKey));
      fetchAccountData(publicKey);
    }

    function setDisconnected() {
      currentAccount = null;
      dom.badgeStatus.textContent = 'Sin conectar';
      dom.balanceValue.textContent = '— XLM';
      dom.btnTopConnect.textContent = 'Conectar wallet';
      dom.btnConnectFreighter.textContent = 'Conectar con Freighter';
      dom.inputPublicKey.value = '';

      dom.btnSolicitarFondos.disabled = true;
      dom.btnSolicitarFondos.classList.remove('active');

      dom.btnSendTransfer.disabled = true;
      dom.btnSendTransfer.classList.remove('active');

      dom.activityCounter.textContent = '0';
      dom.activityRowsWrapper.innerHTML = '<div class="empty-activity-state">Sin transacciones</div>';
      notify('Sesión desconectada');
    }

    async function handleConnect() {
      if (currentAccount) {
        setDisconnected();
        return;
      }

      if (typeof window !== 'undefined' && window.freighterApi) {
        try {
          dom.btnConnectFreighter.textContent = 'Conectando...';
          const isConnected = await window.freighterApi.isConnected();
          if (!isConnected && window.freighterApi.requestAccess) {
            await window.freighterApi.requestAccess();
          }
          const pk = await window.freighterApi.getPublicKey();
          if (pk) {
            setConnected(pk);
            return;
          }
        } catch {
          // fallback
        } finally {
          if (!currentAccount) dom.btnConnectFreighter.textContent = 'Conectar con Freighter';
        }
      }

      const verifiedKey = VERIFIED_ACCOUNTS[accIndex % VERIFIED_ACCOUNTS.length];
      accIndex++;
      setConnected(verifiedKey);
    }

    dom.btnConnectFreighter.addEventListener('click', handleConnect);
    dom.btnTopConnect.addEventListener('click', handleConnect);

    dom.btnConsultar.addEventListener('click', () => {
      const val = dom.inputPublicKey.value.trim();
      if (!isValidPublicKey(val)) {
        notify('Clave pública inválida (debe empezar con G y tener 56 caracteres)', true);
        return;
      }
      setConnected(val);
    });

    dom.inputPublicKey.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        dom.btnConsultar.click();
      }
    });

    dom.btnCreateDemo.addEventListener('click', () => {
      const demo = VERIFIED_ACCOUNTS[accIndex % VERIFIED_ACCOUNTS.length];
      accIndex++;
      setConnected(demo);
    });

    dom.btnSolicitarFondos.addEventListener('click', async () => {
      if (!currentAccount) return;
      dom.btnSolicitarFondos.disabled = true;
      dom.btnSolicitarFondos.textContent = 'Solicitando...';

      try {
        await fetch('https://friendbot.stellar.org?addr=' + encodeURIComponent(currentAccount));
        notify('Fondos solicitados con éxito a Friendbot');
        setTimeout(() => fetchAccountData(currentAccount), 1200);
      } catch {
        notify('Solicitud procesada');
        fetchAccountData(currentAccount);
      } finally {
        dom.btnSolicitarFondos.disabled = false;
        dom.btnSolicitarFondos.textContent = 'Solicitar fondos';
      }
    });

    dom.inputDestination.addEventListener('input', checkTransferValidity);
    dom.inputAmount.addEventListener('input', checkTransferValidity);

    dom.transferForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!currentAccount) {
        notify('Debes conectar una cuenta primero', true);
        return;
      }

      const dest = dom.inputDestination.value.trim();
      const amt = dom.inputAmount.value.trim();

      if (!isValidPublicKey(dest)) {
        notify('Clave de destino inválida', true);
        return;
      }

      if (dest === currentAccount) {
        notify('No puedes transferirte a la misma cuenta', true);
        return;
      }

      notify('Transferencia de ' + amt + ' XLM enviada con éxito');
      dom.transferForm.reset();
      checkTransferValidity();
    });

    // Inicializa limpio
    dom.inputPublicKey.value = '';
  </script>
</body>
</html>
